# ── LE RELEVÉ PENDANT LA SÉANCE ────────────────────────────────────────────
#
# LE PROBLÈME, mesuré sur quarante-deux déclenchements : GitHub n'honore
# PRESQUE JAMAIS les tâches planifiées entre 13 h et 16 h UTC. C'est l'heure
# de pointe de ses serveurs. Or c'est exactement la fenêtre de trading
# (09 h 00 → 10 h 00 New York = 13 h 00 → 14 h 00 UTC l'été). Le lundi
# 28 septembre, les deux créneaux prévus dans la séance ne sont pas partis :
# le premier relevé automatique n'arrivait qu'à 19 h, cinq heures après.
#
# LA SOLUTION : ne pas demander à GitHub de déclencher pendant le trou. On
# démarre AVANT, hors zone morte, le travail ATTEND, puis relève plusieurs
# fois pendant la séance. Un travail peut durer six heures ; il en faut moins
# de quatre. Le dépôt est public, donc les minutes sont gratuites.
#
# Ce fichier ne remplace pas signaux.yml : celui-ci couvre la séance, l'autre
# garde ses passages du soir comme filet.
name: Relevé pendant la séance

on:
  schedule:
    # ── MESURÉ LE 30 SEPTEMBRE, ET C'EST PIRE QU'ON NE CROYAIT ───────────
    # Les trois départs prévus — 10 h 17, 11 h 47, 12 h 37 — n'ont AUCUN été
    # honorés. GitHub a lancé le travail à 16 h 26 puis 17 h 00, soit quatre à
    # six heures en retard, donc APRÈS la fin de la fenêtre : les deux
    # exécutions ont duré dix-neuf secondes et fait un simple rattrapage. La
    # séance n'a pas été surveillée du tout.
    #
    # La zone morte n'est donc pas seulement 13 h → 16 h UTC : le planificateur
    # peut abandonner n'importe quel créneau de la matinée. La seule parade est
    # de multiplier les départs, très tôt, et de laisser le travail attendre —
    # il attend de toute façon jusqu'à 13 h 15, qu'il parte à 6 h ou à 12 h.
    #

    #
    # ── MESURÉ LE 5 OCTOBRE, ET C'EST LE CONSTAT QUI COMMANDE CETTE LISTE ──
    # Sur cinq jours ouvrés, vingt-cinq départs attendus, DIX honorés. Aucun
    # avant 12 h 59 UTC ; la plupart entre 16 h et 18 h 30, soit quatre à six
    # heures de retard, donc après la fermeture de la fenêtre. Le lundi
    # 5 octobre, les cinq créneaux ont été abandonnés : zéro exécution.
    #
    # On ne peut pas forcer GitHub à partir. On peut seulement LUI DEMANDER
    # PLUS SOUVENT : il en abandonne la plupart, il lui en restera un.
    #
    # Pourquoi pas avant 06 h 15 : un travail meurt à 360 minutes, la fenêtre
    # ouvre à 11 h 45 UTC. Partir à 06 h 00 pour attendre 345 minutes ferait
    # tuer le travail juste avant qu'il serve — il aurait l'air d'avoir
    # tourné. Le script refuse d'ailleurs ces départs-là et rend la main.
    #
    # Pourquoi les minutes sont dispersées : la plupart des tâches planifiées
    # du monde tombent à l'heure pile et à la demie, et c'est précisément là
    # que le planificateur sature.
    - cron: '17 6 * * 1-5'
    - cron: '41 6 * * 1-5'
    - cron: '13 7 * * 1-5'
    - cron: '38 7 * * 1-5'
    - cron: '9 8 * * 1-5'
    - cron: '34 8 * * 1-5'
    - cron: '11 9 * * 1-5'
    - cron: '36 9 * * 1-5'
    - cron: '14 10 * * 1-5'
    - cron: '39 10 * * 1-5'
    - cron: '12 11 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '8 12 * * 1-5'
    - cron: '33 12 * * 1-5'
    - cron: '14 13 * * 1-5'
    - cron: '42 13 * * 1-5'
    - cron: '19 14 * * 1-5'
    - cron: '47 14 * * 1-5'
    - cron: '21 15 * * 1-5'
    - cron: '49 15 * * 1-5'
    - cron: '23 16 * * 1-5'
  workflow_dispatch:

concurrency:
  # ⚠️ ON N'ANNULE PLUS LE PRÉCÉDENT, et c'est un renversement délibéré.
  #
  # `cancel-in-progress: true` avait une logique : un second départ remplace un
  # premier au lieu de s'empiler derrière. Mais avec huit créneaux dont
  # certains partent en retard, cette règle DÉTRUIT le travail qu'elle devait
  # protéger : le 30 septembre, un travail parti à 6 h et sagement en attente
  # aurait été tué à 16 h 26 par un démarrage retardataire, juste avant de
  # servir à quelque chose.
  #
  # Avec `false`, le premier arrivé garde la main jusqu'à 15 h 45 et les
  # retardataires patientent derrière — ils trouveront la fenêtre fermée et
  # feront un rattrapage de dix-neuf secondes. C'est exactement ce qu'on veut :
  # le gardien reste, les doublons ne coûtent rien.
  group: seance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  seance:
    runs-on: ubuntu-latest
    # ⚠️ 360 MINUTES, C'EST LA LIMITE DURE DE GITHUB, et elle commande tout.
    # Le script borne lui-même sa fin à 330 minutes après son départ : un
    # créneau matinal couvre le début de la séance puis rend la main, un
    # créneau tardif la couvre en entier. Aucun ne se fait tuer en cours de
    # route, ce qui laisserait croire à un relevé qui n'a pas eu lieu.
    timeout-minutes: 350
    env:
      # Les séries téléchargées sont déposées ici, pour que les vérifications
      # puissent contrôler les données d'entrée juste après. Sans cache, ces
      # contrôles-là sont sautés.
      MECH_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Relever pendant toute la fenêtre
        run: |
          set -u
          git config user.name  "journal-signaux"
          git config user.email "noreply@github.com"

          # ⚠️ LA FENÊTRE N'EST PLUS ÉCRITE ICI. Elle l'était — « 13 h 15 →
          # 15 h 45 UTC » — ce qui correspondait à 09 h → 10 h New York. Quand
          # le modèle AMD a ouvert à 08 h, ce fichier n'a pas suivi : le robot
          # aurait commencé à surveiller QUATRE-VINGT-DIX MINUTES après
          # l'ouverture, en ratant l'heure où tombent 64 % des balayages de
          # grande liquidité. Un réglage qui vit à deux endroits finit toujours
          # par diverger, et personne ne le voit.
          #
          # scripts/fenetre.js déduit la fenêtre des trois stratégies, mesure
          # lui-même le décalage horaire de New York — il change deux fois
          # l'an — et rend deux dates en secondes.
          read -r DEBUT FIN < <(node scripts/fenetre.js)
          node scripts/fenetre.js --clair
          MAINTENANT=$(date -u +%s)
          DEPART=$MAINTENANT

          # ── CE QUE CE TRAVAIL-CI PEUT TENIR ─────────────────────────────
          # GitHub tue un travail à 360 minutes, sans appel. Un départ matinal
          # ne peut donc pas couvrir toute la séance : il en couvre le début,
          # puis rend la main. On borne la fin à 330 minutes après le départ,
          # vingt minutes sous la limite dure pour laisser la dernière poussée
          # se terminer.
          LIMITE=$((DEPART + 330 * 60))
          # La fin VOULUE est gardée à part : c'est elle qui dit ce qu'il
          # fallait couvrir, quand `FIN` dira ce que ce travail-ci peut tenir.
          FIN_VOULUE=$FIN
          [ "$FIN" -gt "$LIMITE" ] && FIN=$LIMITE

          if [ "$DEBUT" -gt "$LIMITE" ]; then
            # Ce travail mourra avant même l'ouverture de la fenêtre. Mieux
            # vaut le dire et rendre la main tout de suite que d'occuper la
            # place pendant six heures pour rien.
            echo "Ouverture dans $(((DEBUT - MAINTENANT) / 60)) minutes, au-delà de ce qu'un travail peut tenir."
            echo "Ce créneau passe la main au suivant."
            exit 0
          fi

          if [ "$MAINTENANT" -lt "$DEBUT" ]; then
            ATTENTE=$((DEBUT - MAINTENANT))
            echo "Attente de $((ATTENTE / 60)) minutes jusqu'à $(date -u -d "@$DEBUT" '+%H:%M UTC')…"
            echo "Ce créneau couvrira la séance jusqu'à $(date -u -d "@$FIN" '+%H:%M UTC')."
            sleep "$ATTENTE"
          elif [ "$MAINTENANT" -gt "$FIN" ]; then
            # Départ très en retard — GitHub le fait. Sans ce garde-fou, la
            # boucle ne tournerait pas une seule fois et le travail se
            # terminerait sans RIEN faire, en ayant l'air d'avoir réussi. On
            # relève au moins une fois : le rattrapage journalier retrouve
            # de toute façon tous les signaux de la journée.
            echo "Démarrage après la fin de la fenêtre — un seul relevé de rattrapage."
            FIN=$((MAINTENANT + 1))
          fi

          PASSAGE=0
          while [ "$(date -u +%s)" -le "$FIN" ]; do
            PASSAGE=$((PASSAGE + 1))
            echo "───────── passage $PASSAGE · $(date -u '+%H:%M UTC') ─────────"

            node scripts/live_log.js || echo "relevé en échec, on continue"
            node scripts/build_single.js || echo "construction en échec, on continue"

            if node scripts/test.js; then
              if git diff --quiet -- data/ docs/; then
                echo "Rien de neuf."
              else
                git add data/ docs/
                git commit -m "Journal : séance du $(date -u '+%Y-%m-%d %H:%M UTC')"
                for i in 1 2 3 4 5; do
                  git pull --rebase --autostash origin main && \
                  git push origin HEAD:main && break
                  sleep $((i * 3))
                done
              fi
            else
              # Les vérifications sont un veto : un chiffre faux ne doit pas
              # atteindre le site, même si ça veut dire ne rien publier.
              echo "::error::Les vérifications ont échoué — rien n'est publié."
              git checkout -- data/ docs/ || true
            fi

            RESTE=$((FIN - $(date -u +%s)))
            [ "$RESTE" -le 0 ] && break
            sleep $(( RESTE < 1200 ? RESTE : 1200 ))     # un passage toutes les 20 min
          done
          # ── DIRE SI LA SÉANCE A VRAIMENT ÉTÉ COUVERTE ────────────────────
          # Sans ces lignes, un travail parti quatre heures en retard se
          # termine « avec succès » après un rattrapage de dix-neuf secondes,
          # et rien ne distingue cette réussite-là d'une vraie surveillance.
          # C'est exactement ce qui s'est produit du 29 septembre au 2 octobre
          # sans que personne le voie.
          DEBUT_REEL=$([ "$DEPART" -gt "$DEBUT" ] && echo "$DEPART" || echo "$DEBUT")
          COUVERT=$(( ($(date -u +%s) - DEBUT_REEL) / 60 ))
          TOTAL=$(( (FIN_VOULUE - DEBUT) / 60 ))
          [ "$COUVERT" -lt 0 ] && COUVERT=0
          echo "Séance couverte en $PASSAGE passage(s)."
          if [ "$PASSAGE" -le 1 ] || [ "$COUVERT" -lt $((TOTAL / 2)) ]; then
            echo "::warning::Fenêtre surveillée $COUVERT min sur $TOTAL — ce n'est pas une séance couverte, c'est un rattrapage. Départ à $(date -u -d "@$DEPART" '+%H:%M UTC') pour une ouverture à $(date -u -d "@$DEBUT" '+%H:%M UTC')."
          else
            echo "Fenêtre surveillée $COUVERT min sur $TOTAL."
          fi
