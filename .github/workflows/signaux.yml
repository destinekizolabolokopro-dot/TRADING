# ── JOURNAL EN DIRECT ──────────────────────────────────────────────────────
# Fait tourner le modèle sur le marché réel pendant la fenêtre de trading,
# que quelqu'un regarde le site ou non, et versionne le résultat.
#
# Aucun ordre n'est passé. C'est un test à blanc : on veut savoir si le
# modèle tient sur des données réelles avant de lui confier un centime.
#
# L'heure de New York bascule entre EDT (UTC−4) et EST (UTC−5) selon la
# saison. Plutôt que de maintenir deux plannings, on déclenche largement de
# 13 h à 15 h UTC et c'est le script qui décide, lui, s'il est bien dans la
# fenêtre 09 h 30 → 10 h 00 heure de New York.
name: Journal des signaux

on:
  schedule:
    # ── LE PLANNING SUIT CE QUE GITHUB HONORE RÉELLEMENT ─────────────────
    # Mesuré sur dix-neuf déclenchements automatiques :
    #
    #   00 h █   01 h ██   17 h ██   18 h ███   19 h ████
    #   20 h █   21 h ██   22 h ██   23 h ██
    #
    # ZÉRO entre 13 h et 16 h UTC, trois jours de suite, alors que quatre
    # créneaux y étaient demandés. C'est l'après-midi américaine, l'heure de
    # pointe des serveurs GitHub : les crons y sont abandonnés. Après 17 h,
    # ils partent sans faute.
    #
    # LA SÉANCE N'EST PLUS TENTÉE ICI. seance.yml s'en charge, en démarrant
    # AVANT la zone morte puis en attendant. Les deux tentatives de 13 h 43 et
    # 14 h 43 ont été retirées pour une raison précise : depuis que seance.yml
    # a son propre groupe de concurrence, les deux travaux peuvent tourner EN
    # MÊME TEMPS et pousser sur main en même temps. La reprise sur rebase
    # rattrape la collision, mais autant ne pas la provoquer — d'autant que
    # ces deux créneaux n'ont jamais rien déclenché.
    #
    # Ce fichier garde donc uniquement les passages du soir, éprouvés, comme
    # filet au cas où seance.yml ne partirait pas du tout.
    - cron: '7 17 * * 1-5'     # à partir d'ici, GitHub répond
    - cron: '23 18 * * 1-5'
    - cron: '41 19 * * 1-5'
    - cron: '19 21 * * 1-5'
    - cron: '37 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorer la fenêtre (pour tester)'
        type: boolean
        default: false

concurrency:
  group: journal-signaux
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    env:
      # Les séries téléchargées sont déposées ici, pour que les vérifications
      # contrôlent aussi les DONNÉES D'ENTRÉE. Sans cache, ces contrôles-là
      # sont sautés — c'est-à-dire précisément dans l'action GitHub, là où le
      # robot tourne vraiment.
      MECH_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Relever les signaux
        run: node scripts/live_log.js ${{ inputs.force && '--force' || '' }}

      - name: Republier la page avec les données fraîches
        run: node scripts/build_single.js

      # Les vérifications tournent APRÈS la construction et AVANT la poussée :
      # c'est le seul ordre qui empêche un chiffre faux d'atteindre le site.
      # Chaque test porte le nom du bug réel qu'il aurait arrêté.
      - name: Vérifier que rien ne s'est désaccordé
        run: node scripts/test.js

      # La référence est à part : elle ne dit pas « le code est incohérent »
      # mais « le modèle ne produit plus la même chose qu'hier ». Un écart ici
      # est soit une amélioration voulue — et il faut alors régénérer la
      # référence à la main — soit une régression silencieuse.
      - name: Le modèle produit-il toujours la même chose ?
        run: node scripts/reference.js
        continue-on-error: true

      - name: Versionner le journal
        run: |
          if git diff --quiet -- data/ docs/; then
            echo "Rien de neuf à enregistrer."
            exit 0
          fi
          git config user.name  "journal-signaux"
          git config user.email "noreply@github.com"
          git add data/ docs/
          git commit -m "Journal : relevé du $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Une autre exécution a pu pousser entre-temps : on rejoue par-dessus.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 3))
          done
          echo "Poussée impossible après cinq tentatives." >&2
          exit 1
